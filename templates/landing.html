<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finlar | Controle Financeiro</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Crect x='3' y='3' width='42' height='42' rx='12' fill='%230d1520' stroke='%2310b981' stroke-width='3'/%3E%3Cpath d='M14 25L24 16L34 25' stroke='%2334d399' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 23V33H30V23' stroke='%2338bdf8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='27' r='2.5' fill='%2334d399'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #06090f;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem 1.5rem;
        }

        /* Cabeçalho */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .brand-title {
            font-size: 2.15rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-right: -4px;
            color: #34d399;
            text-shadow: 0 0 24px rgba(16, 185, 129, 0.55);
        }

        .brand-sub {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-right: -2px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Hero Central */
        .hero-section {
            text-align: center;
            max-width: 820px;
            margin: auto;
            padding: 2rem 0;
        }

        .hero-title {
            font-size: clamp(2.2rem, 5.2vw, 4.1rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin-bottom: 3.4rem;
        }

        .hero-title .highlight {
            display: block;
            color: #10b981;
            text-shadow: 0 0 28px rgba(16, 185, 129, 0.35);
        }

        .btn-cta {
            display: inline-block;
            padding: 0.95rem 2.8rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 22px rgba(2, 132, 199, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-cta:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #0396e0 0%, #0277b5 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }

        /* Pilares na Base */
        .pillars-container {
            max-width: 1050px;
            width: 100%;
            margin: 0 auto 0.75rem;
        }

        .pillar-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.25rem;
        }

        @media (min-width: 768px) {
            .pillar-divider {
                border-right: 1px solid rgba(52, 211, 153, 0.22);
            }
        }

        .pillar-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 0;
        }

        .footer-credits {
            text-align: center;
            margin-top: 3.5rem;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #64748b;
            text-transform: uppercase;
        }

        /* --- ANIMAÇÃO DE ENTRADA EM CASCATA --- */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }

        .hero-title {
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .button-box {
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.45s forwards;
        }

        .pillars-container .row {
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        .footer-credits {
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s forwards;
        }

        /* Realce discreto nos pilares ao passar o mouse */
        .pillar-title {
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        .pillar-box:hover .pillar-title {
            color: #34d399;
            text-shadow: 0 0 14px rgba(52, 211, 153, 0.35);
        }

        /* Ajuste dos créditos em telas de celular */
        @media (max-width: 576px) {
            .footer-credits {
                font-size: 0.65rem;
                letter-spacing: 1.5px;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>

    <div class="page-wrapper">
        <!-- Cabeçalho -->
        <!-- Cabeçalho -->
        <header class="top-bar">
            <div class="logo-badge">
                <svg width="72" height="72" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.35));">
                    <rect x="3" y="3" width="42" height="42" rx="12" fill="#0d1520" stroke="#10b981" stroke-width="2" />
                    <path d="M14 25L24 16L34 25" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M18 23V33H30V23" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <circle cx="24" cy="27" r="2.2" fill="#34d399" />
                </svg>
            </div>

            <div class="brand-right">
                <div class="brand-title">FINLAR</div>
                <div class="brand-sub">Finanças do Lar</div>
            </div>
        </header>

        <!-- Hero Central -->
        <main class="hero-section">
            <h1 class="hero-title">
                Suas finanças
                <span class="highlight">em total equilíbrio</span>
            </h1>
            <div class="button-box">
                <button type="button" class="btn-cta" onclick="window.location.href='/dashboard'">
                    Acessar Painel
                </button>
            </div>
        </main>

        <!-- Pilares e Rodapé -->
        <footer class="pillars-container">
            <div class="row g-3 justify-content-center">
                <div class="col-md-4 pillar-box pillar-divider">
                    <div class="pillar-title">Planejamento</div>
                </div>
                <div class="col-md-4 pillar-box pillar-divider">
                    <div class="pillar-title">Transparência</div>
                </div>
                <div class="col-md-4 pillar-box">
                    <div class="pillar-title">Organização</div>
                </div>
            </div>

            <div class="footer-credits">
                PROJETO PRÁTICO DE SISTEMAS APLICADOS A NEGÓCIOS • 2026 | UNINOVE
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById("bg-canvas");
        const ctx = canvas.getContext("2d");

        let width, height, particles;
        const mouse = { x: null, y: null, radius: 185 };

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener("mouseleave", () => {
            mouse.x = null;
            mouse.y = null;
        });

        function getParticleColor() {
            const rand = Math.random();
            if (rand < 0.60) return "16, 185, 129";   // Verde (Saldo / Equilíbrio)
            if (rand < 0.85) return "56, 189, 248";   // Azul (Renda)
            return "250, 204, 21";                    // Amarelo (Despesas / Atenção)
        }

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            const count = Math.min(Math.floor((width * height) / 13500), 90);
            particles = [];

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.55,
                    vy: (Math.random() - 0.5) * 0.55,
                    radius: Math.random() * 2.1 + 1.3,
                    color: getParticleColor()
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, 0.9)`;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(16, 185, 129, ${(1 - dist / 150) * 0.45})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    const mdx = p.x - mouse.x;
                    const mdy = p.y - mouse.y;
                    const mdist = Math.hypot(mdx, mdy);

                    if (mdist < mouse.radius) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(52, 211, 153, ${(1 - mdist / mouse.radius) * 0.85})`;
                        ctx.lineWidth = 1.35;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", initCanvas);
        initCanvas();
        animate();
    </script>
</body>

</html>
